<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パスワード変更 | らくらくシフト登録</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="m-top"><a class="brand" href="login.html"><span class="mark"><i></i><i></i><i></i></span>らくらくシフト登録</a></div>
<main class="center-shell">

<h1 style="margin-bottom:6px">パスワード変更</h1>
<p class="muted" style="margin-bottom:18px">新しいパスワードを登録します。</p>
<div class="alt note ng" id="err-empty" role="alert">新しいパスワードと確認用パスワードを入力してください</div>

<div class="alt note ng" id="err-format" role="alert">入力形式が違います：8文字以上で、英字と数字を含めてください</div>

<div class="alt note ng" id="err-mismatch" role="alert">新しいパスワードと確認用パスワードが一致しません。もう一度入力してください</div>

<section class="panel">
  <div class="field" style="margin-bottom:14px"><label for="p1">新しいパスワード</label><input id="p1" type="password" autocomplete="new-password"><div class="hint">8文字以上、英字と数字を含む</div></div>
  <div class="field"><label for="p2">確認用パスワード</label><input id="p2" type="password" autocomplete="new-password"></div>
  <div class="form-actions" style="margin-top:16px"><a class="btn" href="login.html">戻る</a><a class="btn primary" href="login.html#pwchanged">登録</a></div>
</section>
<div class="protonote no-print"><b>代替フローの表示確認（プロトタイプ用）</b><br><a href="#err-empty">未入力</a><a href="#err-format">入力形式が違う</a><a href="#err-mismatch">確認用と一致しない</a><br><a href="#" style="margin-top:4px;display:inline-block">表示を閉じる</a></div>
</main>
</body>
</html>
